# Aponta o Gradle para o JDK 21 (compatível com Spring Boot 3.4 + Kotlin 2.1)
# Necessário pois o JDK padrão do sistema (Java 25) não é suportado pelo
# compilador Kotlin DSL embutido no Gradle 8.13.
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.11.10-hotspot

# Performance
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Suprime aviso de restricted methods no Java 25 (não se aplica ao JDK 21)
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError
