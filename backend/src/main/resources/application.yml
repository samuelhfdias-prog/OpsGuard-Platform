spring:
  datasource:
    url: jdbc:h2:mem:rodojacto_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none            # O Flyway gerencia o schema
    show-sql: true
    open-in-view: false          # Boa prática: evita lazy loading fora do contexto JPA
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

security:
  jwt:
    # Chave Base64 de 256 bits (HS256). Em produção, a chave deve ser injetada via variável de ambiente (JWT_SECRET_KEY).
    secret-key: ${JWT_SECRET_KEY:ZHVtbXktc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS0xMjM0NQ==}
    expiration: 86400000  # 24 horas em milissegundos

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8080

logging:
  level:
    com.rodojacto: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
