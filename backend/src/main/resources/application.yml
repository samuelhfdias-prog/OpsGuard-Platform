spring:
  datasource:
    url: jdbc:h2:mem:rodojacto_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none            # O Flyway gerencia o schema
    show-sql: ${SHOW_SQL:false}
    open-in-view: false          # Boa prática: evita lazy loading fora do contexto JPA
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

security:
  jwt:
    # Fallback exclusivo do perfil local. O perfil Docker exige JWT_SECRET_KEY.
    secret-key: ${JWT_SECRET_KEY:ZHVtbXktc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS0xMjM0NQ==}
    expiration: ${JWT_EXPIRATION_MS:3600000}
    issuer: rodojacto-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

app:
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
    manager-password: ${SEED_MANAGER_PASSWORD:Manager@123}
    operator-password: ${SEED_OPERATOR_PASSWORD:Operator@123}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8080
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

logging:
  level:
    com.rodojacto: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.flywaydb: INFO
