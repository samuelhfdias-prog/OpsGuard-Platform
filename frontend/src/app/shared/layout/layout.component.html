<div class="shell">
  <header class="mobile-header">
    <button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="main-navigation" aria-label="Abrir menu principal">☰</button>
    <img src="rodojacto-logo.png" alt="Rodojacto" />
    <span class="mobile-avatar">{{ user()?.name?.charAt(0) | uppercase }}</span>
  </header>

  @if (menuOpen()) {
    <button type="button" class="sidebar-overlay" (click)="closeMenu()" aria-label="Fechar menu"></button>
  }

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="menuOpen()" id="main-navigation">
    <!-- Logo -->
    <div class="sidebar-logo">
      <img src="rodojacto-logo.png" alt="Rodojacto" class="sidebar-logo-img" />
    </div>

    <!-- Label Gestão -->
    <div class="sidebar-module-label">
      <span>SISTEMA DE GESTÃO</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/organizations" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" (click)="closeMenu()">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">Organizações</span>
      </a>
      <a routerLink="/collaborators" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" (click)="closeMenu()">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-label">Colaboradores</span>
      </a>
      <a routerLink="/devices" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item" (click)="closeMenu()">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        <span class="nav-label">Dispositivos</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">{{ user()?.name?.charAt(0) | uppercase }}</div>
        <div class="user-info">
          <span class="user-name">{{ user()?.name }}</span>
          <span class="user-role" [class]="'badge badge-' + user()?.role?.toLowerCase()">
            {{ isManager() ? 'Manager' : 'Operator' }}
          </span>
        </div>
      </div>
      <button type="button" class="btn-icon logout-btn" (click)="logout()" aria-label="Sair do sistema">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Conteúdo principal -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
